spring.application.name=fluxy-backend

# Configuracion local opcional, fuera del repositorio y de la imagen Docker.
# Formato properties: NOMBRE=valor, sin comillas ni export.
spring.config.import=optional:file:./.env[.properties]

# Documentacion OpenAPI y Swagger UI
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.packages-to-scan=com.fluxyBackend.controller
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Database
# Render entrega host, puerto y nombre por separado (no permite componer
# cadenas en render.yaml), asi que la URL JDBC se arma aqui.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fluxy_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Server
server.port=${PORT:8080}
# Sin forward-headers-strategy a proposito: ClientInfo toma la IP del ultimo
# X-Forwarded-For (el que agrega el proxy de Render). Con "framework" o "native"
# la IP pasaria a ser la primera, que la escribe el cliente y esquiva los limites.
server.tomcat.connection-timeout=20s
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cada linea de log lleva el X-Request-Id de la peticion.
logging.pattern.level=%5p [%X{requestId:-}]
app.allowed_origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,https://fluxyweb.vercel.app}

# JWT
# Sin valor por defecto a proposito: una clave por defecto en el repositorio
# permite firmar tokens de cualquier usuario. JwtService valida al arrancar y
# explica como generarla.
jwt.secret=${JWT_SECRET:}
# Access token corto; la sesion se mantiene con el refresh token rotativo.
jwt.access_ttl_minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.admin_ttl_minutes=${JWT_ADMIN_TTL_MINUTES:120}
# Refresh token: 14 dias con "Recordarme", 12 horas sin.
app.session.remember_days=${SESSION_REMEMBER_DAYS:14}
app.session.default_hours=${SESSION_DEFAULT_HOURS:12}

# Verificacion por codigo: correo con SendGrid y celular por SMS con Twilio.
# PHONE_VERIFICATION_CHANNEL: sms (por defecto), whatsapp (congelado) o none.
app.verification.log_codes=${VERIFICATION_LOG_CODES:false}
app.verification.phone_channel=${PHONE_VERIFICATION_CHANNEL:sms}
sms.twilio.account_sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth_token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from=${TWILIO_SMS_FROM:}
sms.twilio.messaging_service_sid=${TWILIO_MESSAGING_SERVICE_SID:}
sms.brand=${SMS_BRAND:Fluxy}
# WhatsApp Cloud API: congelado. Solo se usa con PHONE_VERIFICATION_CHANNEL=whatsapp.
whatsapp.cloud.token=${WHATSAPP_CLOUD_TOKEN:}
whatsapp.cloud.phone_number_id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID:}
whatsapp.cloud.otp_template=${WHATSAPP_CLOUD_OTP_TEMPLATE:}
whatsapp.cloud.template_language=${WHATSAPP_CLOUD_TEMPLATE_LANGUAGE:es}
whatsapp.cloud.template_has_copy_button=${WHATSAPP_CLOUD_TEMPLATE_COPY_BUTTON:true}
whatsapp.cloud.api_version=${WHATSAPP_CLOUD_API_VERSION:v21.0}

# Titular que figura en los documentos legales y en el Libro de Reclamaciones.
app.legal.provider_name=${LEGAL_PROVIDER_NAME:Assemble S.A.C.}
app.legal.provider_tax_id=${LEGAL_PROVIDER_TAX_ID:}
app.legal.provider_address=${LEGAL_PROVIDER_ADDRESS:}
# Libro de Reclamaciones: plazo de respuesta (dias habiles) y a quien avisar de cada hoja.
app.complaints.response_business_days=${COMPLAINTS_RESPONSE_BUSINESS_DAYS:15}
app.complaints.notify_email=${COMPLAINTS_NOTIFY_EMAIL:soporte@fluxyweb.com}

# Acceso con Google y Apple (OpenID Connect). Sin client id, el boton no aparece.
oauth.google.client_id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.apple.client_id=${OAUTH_APPLE_CLIENT_ID:}
oauth.apple.redirect_uri=${OAUTH_APPLE_REDIRECT_URI:}

# Ciclo de vida de negocios FREE sin actividad (dias)
app.lifecycle.inactive_days=${LIFECYCLE_INACTIVE_DAYS:30}
app.lifecycle.suspend_days=${LIFECYCLE_SUSPEND_DAYS:60}
app.lifecycle.archive_days=${LIFECYCLE_ARCHIVE_DAYS:90}
app.lifecycle.deletion_days=${LIFECYCLE_DELETION_DAYS:180}
app.lifecycle.deletion_grace_days=${LIFECYCLE_DELETION_GRACE_DAYS:30}
app.lifecycle.owner_deletion_grace_days=${LIFECYCLE_OWNER_DELETION_GRACE_DAYS:14}
# La anonimizacion es irreversible: activarla solo con backups verificados.
app.lifecycle.purge_enabled=${LIFECYCLE_PURGE_ENABLED:false}

# Alertas de seguridad por umbral
app.security.alert_email=${SECURITY_ALERT_EMAIL:}

# Email
sendgrid.api.key=${SENDGRID_API_KEY:}
mail.from=${MAIL_FROM:notificaciones@fluxyweb.com}

# Mercado Pago
mercadopago.access_token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook_secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# Public URLs
app.frontend_url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend_url=${APP_BACKEND_URL:http://localhost:8080}

# Vercel custom domains
vercel.token=${VERCEL_TOKEN:}
vercel.project_id=${VERCEL_PROJECT_ID:}
vercel.team_id=${VERCEL_TEAM_ID:}

# Web Push
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:notificaciones@fluxyweb.com}

# Administrator
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}

# Bounded executor used by asynchronous notifications
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=12
spring.task.execution.pool.queue-capacity=200

# Salud del servicio
# Solo se expone health. show-details=never evita que un anonimo vea el estado
# de la base, el espacio en disco y demas detalles internos.
management.endpoints.web.exposure.include=health,metrics
management.metrics.tags.application=fluxy-backend
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
